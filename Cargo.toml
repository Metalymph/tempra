[workspace]
members = [
  "crates/tempra-cli",
  "crates/tempra-driver",
  "crates/tempra-session",
  "crates/tempra-span",
  "crates/tempra-diagnostics",
  "crates/tempra-fs",
  "crates/tempra-lexer",
  "crates/tempra-parser",
  "crates/tempra-ast",
  "crates/tempra-hir",
  "crates/tempra-typeck",
  "crates/tempra-mir",
  "crates/tempra-ir",
  "crates/tempra-opt",
  "crates/tempra-interpreter",
  "crates/tempra-runtime",
  "crates/tempra-stdlib",
  "crates/tempra-backend-wasm",
  "crates/tempra-wasm-host",
  "crates/tempra-component-host",
  "crates/tempra-backend-cranelift",
  "crates/tempra-linker",
  "crates/tempra-package",
  "crates/tempra-repl",
  "crates/tempra-lsp",
  "crates/tempra-testing",
  "crates/tempra-tir",
  "crates/tempra-tir-lower",
  "crates/tempra-tir-interp",
  "crates/tempra-bytecode",
  "crates/tempra-bytecode-lower", "crates/tempra-vm",
  "crates/tempra-jit-cranelift",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Lorenzo Pirro"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tempra-session = { path = "crates/tempra-session" }
tempra-span = { path = "crates/tempra-span" }
tempra-diagnostics = { path = "crates/tempra-diagnostics" }
tempra-fs = { path = "crates/tempra-fs" }
tempra-lexer = { path = "crates/tempra-lexer" }
tempra-parser = { path = "crates/tempra-parser" }
tempra-ast = { path = "crates/tempra-ast" }
tempra-hir = { path = "crates/tempra-hir" }
tempra-typeck = { path = "crates/tempra-typeck" }
tempra-mir = { path = "crates/tempra-mir" }
tempra-ir = { path = "crates/tempra-ir" }
tempra-opt = { path = "crates/tempra-opt" }
tempra-interpreter = { path = "crates/tempra-interpreter" }
tempra-runtime = { path = "crates/tempra-runtime" }
tempra-stdlib = { path = "crates/tempra-stdlib" }
tempra-backend-wasm = { path = "crates/tempra-backend-wasm" }
tempra-wasm-host = { path = "crates/tempra-wasm-host" }
tempra-component-host = { path = "crates/tempra-component-host" }
tempra-backend-cranelift = { path = "crates/tempra-backend-cranelift" }
tempra-linker = { path = "crates/tempra-linker" }
tempra-package = { path = "crates/tempra-package" }
tempra-repl = { path = "crates/tempra-repl" }
tempra-lsp = { path = "crates/tempra-lsp" }
tempra-testing = { path = "crates/tempra-testing" }
tempra-driver = { path = "crates/tempra-driver" }
tempra-tir = { path = "crates/tempra-tir" }
tempra-tir-lower = { path = "crates/tempra-tir-lower" }
tempra-tir-interp = { path = "crates/tempra-tir-interp" }
tempra-bytecode = { path = "crates/tempra-bytecode" }
tempra-bytecode-lower = { path = "crates/tempra-bytecode-lower" }
tempra-vm = { path = "crates/tempra-vm" }


[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "z"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
